<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing - Admin Auth</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    .vertical-brand { position: absolute; left: 30px; top: 50%; transform: translateY(-50%) rotate(-90deg); font-family: 'NDot55', monospace; color: #bb86fc; letter-spacing: 3px; font-size: 1.2rem; transform-origin: left center; }
    .login-card { width: 100%; max-width: 420px; background: #1a1a1a; border: 1px solid #bb86fc; border-radius: 16px; padding: 40px; box-shadow: 0 0 40px rgba(255,42,42,0.1); }
    .login-title { font-family: 'NDot55', monospace; font-size: 2rem; margin-bottom: 30px; color: #fff; text-transform: uppercase; }
    .login-input { background: transparent; border: 1px solid #555; color: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
    .btn-signin { background: #bb86fc; color: #fff; width: 100%; padding: 14px; border-radius: 24px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s;}
    .btn-signin:hover { transform: scale(1.02); background: #9b51e0; }
    .student-link { position: absolute; bottom: 20px; left: 30px; color: #555; font-size: 0.8rem; text-decoration: none; font-family: 'NDot55'; }
    .student-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="vertical-brand glitch-hover">Admin</div>
    
    <div class="login-card">
      <h1 class="login-title">Sign In</h1>
      <form id="adminLoginForm">
        <input type="text" id="a_usn" class="login-input" placeholder="Admin ID" required>
        <input type="password" id="a_password" class="login-input" placeholder="Password" required>
        <button type="submit" class="btn-signin">Sign in</button>
      </form>
    </div>

    <a href="index.html" class="student-link"> << Student Portal </a>
  </div>

  <div id="customModal" class="modal-overlay d-none">
    <div class="modal-content">
      <p id="modalMsg"></p>
      <button class="btn" style="background:#bb86fc" onclick="document.getElementById('customModal').classList.add('d-none')">OK</button>
    </div>
  </div>

  <script>
    function showModal(msg) {
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('customModal').classList.remove('d-none');
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usn = document.getElementById('a_usn').value;
      const password = document.getElementById('a_password').value;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usn, password }) });
        const data = await res.json();
        
        if(data.success && data.user.role === 'admin') {
          localStorage.setItem('usn', data.user.usn);
          localStorage.setItem('role', 'admin');
          window.location.href = 'admin_dashboard.html';
        } else {
          showModal('Access Denied');
        }
      } catch (err) { showModal('Server error'); }
    });
  </script>
</body>
</html>
